<!doctype html>
<html lang="es">

  <style>
    :root {
      --noche: #05060F;
      --luz: #F4E3BF;
      --texto: rgba(236, 238, 255, .92);
      --suave: rgba(214, 220, 255, .58);
      --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
      --ui: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--noche); color: var(--texto);
      touch-action: none; overscroll-behavior: none;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .centro {
      position: fixed; inset: 0; display: grid; place-items: center; text-align: center;

    }
    .marca { opacity: 0; animation: aparecer 2.4s cubic-bezier(.2, .7, .2, 1) .6s forwards; }
    h1 {

      color: var(--suave); letter-spacing: .01em;
    }
    .pie {
      position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom));

      font: 500 11px/1.4 var(--ui); letter-spacing: .22em; text-transform: uppercase; color: rgba(214, 220, 255, .38);
      opacity: 0; animation: aparecer 2s ease 2.2s forwards;
    }
    .toca {
      position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; pointer-events: none;
      font: italic 400 17px var(--serif); color: rgba(236, 238, 255, .7);
      opacity: 0; transition: opacity 1.2s ease;
    }
    .toca.on { opacity: 1; }
    .toca svg { width: 30px; height: 30px; overflow: visible; animation: tocar 1.6s ease-in-out infinite; }
    .toca .cp { fill: rgba(255, 253, 249, .92); stroke: #1b1e33; stroke-width: 1.4; stroke-linejoin: round; }
    .toca .cl { fill: none; stroke: #1b1e33; stroke-width: 1.4; stroke-linecap: round; }
    .toca .cr { fill: none; stroke: var(--luz); stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: center; animation: onda 1.6s ease-out infinite; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(8px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes tocar { 0%, 100% { transform: none; } 40% { transform: scale(.86); } 55% { transform: none; } }
    @keyframes onda { 0%, 35% { opacity: 0; transform: scale(.4); } 45% { opacity: .9; } 85%, 100% { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) {
      .marca, .pie { animation: none; opacity: 1; }
      .toca svg, .toca .cr { animation: none; }
    }

  <main class="centro">

  <div class="toca" id="toca" aria-hidden="true">
    <svg viewBox="0 0 32 32"><circle class="cr" cx="15" cy="5.5" r="4"/><path class="cp" d="M13 18V7.5a2 2 0 0 1 4 0V13a2 2 0 0 1 4 0v1a2 2 0 0 1 4 0v6c0 4.6-3.4 8-8 8h-1.2c-2.7 0-4.6-1.2-6-3.3l-4.2-6.1a2 2 0 0 1 3.2-2.4L13 20z"/><path class="cl" d="M17 13v3M21 14v2.5"/></svg>
    <span>Toca el cielo</span>
  </div>

  <p class="pie">Luis Anto · Docente de Matemática</p>

  <script>
  (function () {
    'use strict';

    /* ---------- sin zoom: se siente como una app ---------- */
    var stop = function (e) { if (e.cancelable) e.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, stop, { passive: false }); });
    document.addEventListener('touchmove', stop, { passive: false });
    window.addEventListener('wheel', function (e) { if (e.ctrlKey || e.metaKey) stop(e); }, { passive: false });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].indexOf(e.key) >= 0) stop(e);
    });

    var cv = document.getElementById('cielo');
    var cx = cv.getContext('2d');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = 0, H = 0, DPR = 1;
    var estrellas = [];
    var constelaciones = [];
    var fugaces = [];
    var puntero = { x: -9999, y: -9999, activo: false, sx: 0, sy: 0 };

    /* ---------- curvas: cada constelación es una regla matemática ---------- */
    var TAU = Math.PI * 2;
    var PI = Math.PI;
    function polar(r, a) { return [r * Math.cos(a), -r * Math.sin(a)]; }
    function sgn(v) { return v < 0 ? -1 : 1; }
    // integrales de Fresnel (clotoide), con Simpson
    function fresnel(T) {
      var n = 24, h = T / n, c = 0, s = 0;
      for (var i = 0; i <= n; i++) {
        var u = i * h, w = (i === 0 || i === n) ? 1 : (i % 2 ? 4 : 2), g = PI * u * u / 2;
        c += w * Math.cos(g); s += w * Math.sin(g);
      }
      return [c * h / 3, s * h / 3];
    }
    // c: 1 = curva cerrada
    var CURVAS = [
      /* --- funciones --- */
      { nombre: 'y = x²', n: 17, f: function (t) { var x = -1.4 + 2.8 * t; return [x, -x * x + 1]; } },
      { nombre: 'y = x³', n: 19, f: function (t) { var x = -1.25 + 2.5 * t; return [x / 1.25, -x * x * x * .5]; } },
      { nombre: 'y = x³ − x', n: 21, f: function (t) { var x = -1.3 + 2.6 * t; return [x / 1.3, -(x * x * x - x) * .85]; } },
      { nombre: 'y = |x|', n: 15, f: function (t) { var x = -1 + 2 * t; return [x, -Math.abs(x) + .5]; } },
      { nombre: 'y = 2x + 1', n: 9, f: function (t) { var x = -1 + 2 * t; return [x * .7, -(2 * x + 1) * .4 + .4]; } },
      { nombre: 'y = √x', n: 16, f: function (t) { var x = 4 * t * t; return [(x - 2) / 2, -Math.sqrt(x) * .5 + .5]; } },
      { nombre: 'y = sen x', n: 22, f: function (t) { var x = t * TAU; return [x / PI - 1, -Math.sin(x) * .6]; } },
      { nombre: 'y = cos x', n: 22, f: function (t) { var x = t * TAU; return [x / PI - 1, -Math.cos(x) * .6]; } },
      { nombre: 'y = tan x', n: 18, f: function (t) { var x = -1.25 + 2.5 * t; return [x / 1.25, -Math.tan(x) * .3]; } },
      { nombre: 'y = eˣ', n: 18, f: function (t) { var x = -2.4 + 3.4 * t; return [(x + .7) / 1.7, -Math.exp(x) * .38 + .55]; } },
      { nombre: 'y = ln x', n: 18, f: function (t) { var x = .08 + 2.92 * t * t; return [(x - 1.5) / 1.5, -Math.log(x) * .42 + .1]; } },
      { nombre: 'y = 1/x', n: 16, f: function (t) { var x = .18 + t * 1.8; return [x - 1, -(1 / x) * .35 + .8]; } },
      { nombre: 'y = arctan x', n: 19, f: function (t) { var x = -5 + 10 * t; return [x / 5, -Math.atan(x) * .55]; } },
      { nombre: 'y = sen x / x', n: 30, f: function (t) { var x = -3 * PI + 6 * PI * t, v = Math.abs(x) < 1e-6 ? 1 : Math.sin(x) / x; return [x / (3 * PI), -v * .85 + .25]; } },
      { nombre: 'campana de Gauss', n: 19, f: function (t) { var x = -2 + 4 * t; return [x / 2, -Math.exp(-x * x) * 1.1 + .55]; } },
      { nombre: 'y = 1/(1 + e⁻ˣ)', n: 19, f: function (t) { var x = -6 + 12 * t; return [x / 6, -(1 / (1 + Math.exp(-x))) * 1.1 + .55]; } },
      { nombre: 'bruja de Agnesi', n: 19, f: function (t) { var x = -3 + 6 * t; return [x / 3, -1 / (1 + x * x) * .95 + .45]; } },
      { nombre: 'serpentina de Newton', n: 29, f: function (t) { var x = -4 + 8 * t; return [x / 4, -2 * x / (1 + x * x) * .6]; } },
      { nombre: 'catenaria y = cosh x', n: 17, f: function (t) { var x = -1.5 + 3 * t; return [x / 1.5, -Math.cosh(x) * .45 + .95]; } },
      { nombre: 'onda amortiguada', n: 34, f: function (t) { var x = t * 4 * PI; return [x / (2 * PI) - 1, -Math.exp(-x / 4.5) * Math.sin(2 * x) * .75]; } },
      { nombre: 'Σ sen(kx)/k', n: 40, f: function (t) { var x = t * TAU, v = 0; for (var k = 1; k <= 7; k += 2) v += Math.sin(k * x) / k; return [x / PI - 1, -v * .7]; } },
      { nombre: 'y = sen x + sen 2x', n: 30, f: function (t) { var x = t * TAU; return [x / PI - 1, -(Math.sin(x) + Math.sin(2 * x)) * .36]; } },
      { nombre: 'tractriz', n: 21, f: function (t) { var u = -3 + 6 * t; return [(u - Math.tanh(u)) / 2.1, -(1 / Math.cosh(u)) * .85 + .4]; } },
      /* --- cónicas --- */
      { nombre: 'x² + y² = 1', n: 18, c: 1, f: function (t) { var a = t * TAU; return [Math.cos(a), Math.sin(a)]; } },
      { nombre: 'x²/4 + y² = 1', n: 24, c: 1, f: function (t) { var a = t * TAU; return [Math.cos(a), Math.sin(a) * .55]; } },
      { nombre: 'x² − y² = 1', n: 17, f: function (t) { var u = -1.4 + 2.8 * t; return [Math.cosh(u) * .55 - .85, Math.sinh(u) * .55]; } },
      { nombre: 'x = y²', n: 17, f: function (t) { var y = -1.2 + 2.4 * t; return [y * y * .8 - .55, y * .8]; } },
      { nombre: 'y² = x³', n: 19, f: function (t) { var u = -1 + 2 * t; return [u * u * 1.2 - .6, -u * u * u * .9]; } },
      { nombre: 'cisoide de Diocles', n: 21, f: function (t) { var u = -1.6 + 3.2 * t, d = 1 + u * u; return [2 * u * u / d - .65, -2 * u * u * u / d * .45]; } },
      /* --- polares --- */
      { nombre: 'r = cos 3θ', n: 30, c: 1, f: function (t) { var a = t * PI, r = Math.cos(3 * a); return [r * Math.cos(a), r * Math.sin(a)]; } },
      { nombre: 'r = sen 2θ', n: 40, c: 1, f: function (t) { var a = t * TAU; return polar(Math.sin(2 * a), a); } },
      { nombre: 'r = sen 5θ', n: 50, c: 1, f: function (t) { var a = t * PI; return polar(Math.sin(5 * a), a); } },
      { nombre: 'r = cos 4θ', n: 64, c: 1, f: function (t) { var a = t * TAU; return polar(Math.cos(4 * a), a); } },
      { nombre: 'r = cos(2θ/3)', n: 60, c: 1, f: function (t) { var a = t * 6 * PI; return polar(Math.cos(2 * a / 3), a); } },
      { nombre: 'r = 1 + cos θ', n: 24, c: 1, f: function (t) { var a = t * TAU, r = (1 + Math.cos(a)) / 2; return [r * Math.cos(a) - .25, r * Math.sin(a)]; } },
      { nombre: 'r = 1 + 2 cos θ', n: 34, c: 1, f: function (t) { var a = t * TAU, r = (1 + 2 * Math.cos(a)) / 3; var p = polar(r, a); return [p[0] - .35, p[1]]; } },
      { nombre: 'r = θ', n: 34, f: function (t) { var a = t * 4 * PI; return polar(a / (4 * PI), a); } },
      { nombre: 'r = √θ', n: 50, f: function (t) { var a = t * 6 * PI; return polar(Math.sqrt(a / (6 * PI)), a); } },
      { nombre: 'r = 1/θ', n: 30, f: function (t) { var a = .9 + t * (4 * PI - .9); var p = polar(.55 / a, a); return [p[0] * 1.6 - .3, p[1] * 1.6]; } },
      { nombre: 'espiral logarítmica', n: 26, f: function (t) { var a = t * 3.2 * PI, r = Math.exp(.2 * a) / Math.exp(.2 * 3.2 * PI); return [r * Math.cos(a), r * Math.sin(a)]; } },
      { nombre: 'espiral áurea φ', n: 30, f: function (t) { var a = t * 3 * PI, r = Math.pow(1.618, 2 * (a - 3 * PI) / PI); return polar(r, a); } },
      { nombre: 'lemniscata', n: 28, c: 1, f: function (t) { var a = t * TAU, d = 1 + Math.sin(a) * Math.sin(a); return [Math.cos(a) / d, Math.sin(a) * Math.cos(a) / d]; } },
      { nombre: 'lemniscata de Gerono', n: 30, c: 1, f: function (t) { var a = t * TAU; return [Math.cos(a), Math.sin(a) * Math.cos(a) * 1.1]; } },
      { nombre: 'folium de Descartes', n: 26, c: 1, f: function (t) { var a = t * PI / 2, s = Math.sin(a), c = Math.cos(a), d = s * s * s + c * c * c, r = 3 * s * c / d; return [r * c / 1.5 - .5, -r * s / 1.5 + .5]; } },
      { nombre: 'r = e^(sen θ) − 2 cos 4θ', n: 90, c: 1, f: function (t) { var a = t * TAU, r = Math.exp(Math.sin(a)) - 2 * Math.cos(4 * a); return [r * Math.cos(a) / 3.3, -r * Math.sin(a) / 3.3 + .25]; } },
      /* --- paramétricas y ruletas --- */
      { nombre: 'x = sen 3t, y = sen 2t', n: 34, c: 1, f: function (t) { var a = t * TAU; return [Math.sin(3 * a), Math.sin(2 * a)]; } },
      { nombre: 'x = sen 5t, y = sen 4t', n: 84, c: 1, f: function (t) { var a = t * TAU; return [Math.sin(5 * a + PI / 2), Math.sin(4 * a)]; } },
      { nombre: 'x = sen 3t, y = sen 4t', n: 56, c: 1, f: function (t) { var a = t * TAU; return [Math.sin(3 * a + PI / 2), Math.sin(4 * a)]; } },
      { nombre: 'astroide', n: 40, c: 1, f: function (t) { var a = t * TAU, c = Math.cos(a), s = Math.sin(a); return [c * c * c, s * s * s]; } },
      { nombre: 'deltoide', n: 36, c: 1, f: function (t) { var a = t * TAU; return [(2 * Math.cos(a) + Math.cos(2 * a)) / 3, (2 * Math.sin(a) - Math.sin(2 * a)) / 3]; } },
      { nombre: 'nefroide', n: 44, c: 1, f: function (t) { var a = t * TAU; return [(3 * Math.cos(a) - Math.cos(3 * a)) / 4, (3 * Math.sin(a) - Math.sin(3 * a)) / 4]; } },
      { nombre: 'hipocicloide', n: 60, c: 1, f: function (t) { var a = t * TAU; return [(4 * Math.cos(a) + Math.cos(4 * a)) / 5, (4 * Math.sin(a) - Math.sin(4 * a)) / 5]; } },
      { nombre: 'cicloide', n: 30, f: function (t) { var u = t * 4 * PI; return [(u - Math.sin(u)) / (2 * PI) - 1, -(1 - Math.cos(u)) * .38 + .38]; } },
      { nombre: 'espirógrafo', n: 64, c: 1, f: function (t) { var a = t * TAU; return [(4 * Math.cos(a) - 2 * Math.cos(4 * a)) / 6, (4 * Math.sin(a) - 2 * Math.sin(4 * a)) / 6]; } },
      { nombre: 'hipotrocoide', n: 80, c: 1, f: function (t) { var a = t * 6 * PI; return [(2 * Math.cos(a) + 5 * Math.cos(2 * a / 3)) / 7, (2 * Math.sin(a) - 5 * Math.sin(2 * a / 3)) / 7]; } },
      { nombre: 'corazón', n: 40, c: 1, f: function (t) { var a = t * TAU, s = Math.sin(a); return [16 * s * s * s / 17, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17]; } },
      { nombre: '|x|⁴ + |y|⁴ = 1', n: 40, c: 1, f: function (t) { var a = t * TAU, c = Math.cos(a), s = Math.sin(a); return [sgn(c) * Math.sqrt(Math.abs(c)), sgn(s) * Math.sqrt(Math.abs(s))]; } },
      { nombre: 'clotoide', n: 44, f: function (t) { var u = -2.4 + 4.8 * t, p = fresnel(Math.abs(u)), k = sgn(u); return [k * p[0] * 1.25, -k * p[1] * 1.25]; } },
      { nombre: 'curva de Bézier', n: 20, f: function (t) { var m = 1 - t, a = m * m * m, b = 3 * m * m * t, c = 3 * m * t * t, d = t * t * t; return [-a - .4 * b + .4 * c + d, .5 * a - b + c - .5 * d]; } },
      /* --- sucesiones y límites --- */
      { nombre: 'lím 1/n = 0', n: 12, f: function (t) { var k = Math.round(t * 11) + 1; return [1 / k * 2 - 1, -(1 / k) * .9 + .45]; } },
      { nombre: 'lím (1 + 1/n)ⁿ = e', n: 14, f: function (t) { var k = Math.round(t * 13) + 1; return [t * 2 - 1, -(Math.pow(1 + 1 / k, k) - 2.36) * 1.5]; } },
      { nombre: 'Σ 1/2ⁿ = 1', n: 11, f: function (t) { var k = Math.round(t * 10) + 1; return [t * 2 - 1, -(1 - Math.pow(2, -k) - .72) * 1.6]; } },
      { nombre: 'Σ (−1)ⁿ⁺¹/n = ln 2', n: 16, f: function (t) { var k = Math.round(t * 15) + 1, v = 0; for (var j = 1; j <= k; j++) v += (j % 2 ? 1 : -1) / j; return [t * 2 - 1, -(v - .72) * 1.8]; } },
    ];
    // baraja: todas las curvas salen antes de repetirse
    var baraja = [];
    function siguienteCurva() {
      if (!baraja.length) {
        for (var b = 0; b < CURVAS.length; b++) baraja.push(b);
        for (var r = baraja.length - 1; r > 0; r--) { var j = Math.floor(Math.random() * (r + 1)), tmp = baraja[r]; baraja[r] = baraja[j]; baraja[j] = tmp; }
      }
      return baraja.pop();
    }

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function crearEstrellas() {
      var n = Math.min(520, Math.round((W * H) / 2300));
      estrellas = [];
      for (var i = 0; i < n; i++) {
        var d = Math.random();
        estrellas.push({
          x: Math.random() * W, y: Math.random() * H,
          r: d < .9 ? rnd(.25, 1.05) : rnd(1.05, 1.7),
          z: rnd(.15, 1),
          fase: Math.random() * TAU,
          vel: rnd(.4, 1.3),
          tono: Math.random() < .14 ? 'calida' : (Math.random() < .2 ? 'azul' : 'blanca'),
        });
      }
    }

    function ajustar() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      cx.setTransform(DPR, 0, 0, DPR, 0, 0);
      crearEstrellas();
    }

    // zona del texto central: las constelaciones automáticas la evitan
    function zonaTexto() {
      var w = Math.min(W * .86, 620), h = Math.min(H * .34, 240);
      return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
    }
    function chocan(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

    function nuevaConstelacion(px, py) {
      var c = CURVAS[siguienteCurva()];
      var s = Math.min(W, H) * rnd(.13, .19);
      var giro = rnd(-.35, .35);
      var ox, oy, caja, intentos = 0;
      var zt = zonaTexto();
      do {
        ox = px != null ? px : rnd(s * 1.3, W - s * 1.3);
        oy = py != null ? py : rnd(s * 1.2, H - s * 1.4);
        caja = { x: ox - s * 1.2, y: oy - s * 1.2, w: s * 2.4, h: s * 2.4 };
        intentos++;
      } while (px == null && chocan(caja, zt) && intentos < 40);
      var pts = [];
      for (var k = 0; k < c.n; k++) {
        var t = c.c ? k / c.n : k / (c.n - 1);
        var p = c.f(t);
        var x = p[0] * Math.cos(giro) - p[1] * Math.sin(giro);
        var y = p[0] * Math.sin(giro) + p[1] * Math.cos(giro);
        pts.push({ x: ox + x * s, y: oy + y * s, r: c.n > 45 ? rnd(.8, 1.3) : rnd(1.1, 1.9) });
      }
      if (c.c) pts.push(pts[0]);
      var maxY = -Infinity, sumX = 0;
      pts.forEach(function (q) { maxY = Math.max(maxY, q.y); sumX += q.x; });
      constelaciones.push({
        pts: pts, nombre: c.nombre, t0: performance.now(),
        dibujo: reduced ? 1 : 1700, quieta: reduced ? 3800 : 3000, salida: reduced ? 900 : 1400,
        lx: sumX / pts.length, ly: maxY + 26,
      });
      if (constelaciones.length > 4) constelaciones.shift();
    }

    function nuevaFugaz() {
      var x = rnd(W * .1, W * .9), y = rnd(H * .05, H * .45);
      var ang = rnd(Math.PI * .12, Math.PI * .28) * (Math.random() < .5 ? 1 : -1) + (Math.random() < .5 ? 0 : Math.PI);
      fugaces.push({ x: x, y: y, vx: Math.cos(ang) * 9, vy: Math.abs(Math.sin(ang)) * 9, vida: 1 });
    }

    /* ---------- pintar ---------- */
    function fondo() {
      var g = cx.createRadialGradient(W * .5, H * .55, 0, W * .5, H * .55, Math.max(W, H) * .8);
      g.addColorStop(0, '#0d1230');
      g.addColorStop(.55, '#080a1c');
      g.addColorStop(1, '#04050c');
      cx.fillStyle = g; cx.fillRect(0, 0, W, H);
      // nebulosas tenues
      var n1 = cx.createRadialGradient(W * .18, H * .22, 0, W * .18, H * .22, Math.max(W, H) * .45);
      n1.addColorStop(0, 'rgba(120, 90, 200, .10)'); n1.addColorStop(1, 'rgba(120, 90, 200, 0)');
      cx.fillStyle = n1; cx.fillRect(0, 0, W, H);
      var n2 = cx.createRadialGradient(W * .85, H * .8, 0, W * .85, H * .8, Math.max(W, H) * .5);
      n2.addColorStop(0, 'rgba(60, 120, 200, .09)'); n2.addColorStop(1, 'rgba(60, 120, 200, 0)');
      cx.fillStyle = n2; cx.fillRect(0, 0, W, H);
    }
    var FUENTE = 'italic 400 16px ' + getComputedStyle(document.documentElement).getPropertyValue('--serif');
    var COLOR = { blanca: '236, 238, 255', azul: '190, 210, 255', calida: '255, 226, 186' };

    function pintar(now) {
      fondo();
      // paralaje suave con el puntero
      var tx = puntero.activo ? (puntero.x - W / 2) : 0, ty = puntero.activo ? (puntero.y - H / 2) : 0;
      puntero.sx += (tx - puntero.sx) * .04; puntero.sy += (ty - puntero.sy) * .04;

      var cerca = [];
      var R = Math.min(150, Math.max(110, Math.min(W, H) * .2));
      for (var i = 0; i < estrellas.length; i++) {
        var e = estrellas[i];
        var px = e.x - puntero.sx * .018 * e.z, py = e.y - puntero.sy * .018 * e.z;
        var brillo = reduced ? .75 : .55 + .45 * Math.sin(now * .001 * e.vel + e.fase);
        var a = (.35 + .65 * e.z) * brillo;
        cx.fillStyle = 'rgba(' + COLOR[e.tono] + ',' + a.toFixed(3) + ')';
        cx.beginPath(); cx.arc(px, py, e.r, 0, TAU); cx.fill();
        if (e.r > 1.3) { cx.fillStyle = 'rgba(' + COLOR[e.tono] + ',' + (a * .12).toFixed(3) + ')'; cx.beginPath(); cx.arc(px, py, e.r * 3.2, 0, TAU); cx.fill(); }
        if (puntero.activo) {
          var dx = px - puntero.x, dy = py - puntero.y, d = Math.sqrt(dx * dx + dy * dy);
          if (d < R) cerca.push({ x: px, y: py, d: d });
        }
      }

      // el dedo o el mouse une las estrellas cercanas
      if (cerca.length) {
        cx.lineWidth = .7;
        for (var j = 0; j < cerca.length; j++) {
          var p = cerca[j];
          cx.strokeStyle = 'rgba(214, 220, 255,' + ((1 - p.d / R) * .45).toFixed(3) + ')';
          cx.beginPath(); cx.moveTo(puntero.x, puntero.y); cx.lineTo(p.x, p.y); cx.stroke();
          for (var k = j + 1; k < cerca.length; k++) {
            var q = cerca[k], ex = p.x - q.x, ey = p.y - q.y, dd = ex * ex + ey * ey;
            if (dd < 3600) { cx.strokeStyle = 'rgba(214, 220, 255,' + ((1 - Math.sqrt(dd) / 60) * .3).toFixed(3) + ')'; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(q.x, q.y); cx.stroke(); }
          }
        }
      }

      // constelaciones
      for (var c = constelaciones.length - 1; c >= 0; c--) {
        var C = constelaciones[c];
        var t = Math.max(0, now - C.t0), total = C.dibujo + C.quieta + C.salida;
        if (t > total) { constelaciones.splice(c, 1); continue; }
        var avance = Math.min(1, t / C.dibujo);
        var alfa = t < C.dibujo + C.quieta ? 1 : 1 - (t - C.dibujo - C.quieta) / C.salida;
        var segs = (C.pts.length - 1) * avance;
        cx.save();
        cx.lineWidth = 1.1; cx.lineCap = 'round'; cx.lineJoin = 'round';
        cx.strokeStyle = 'rgba(244, 227, 191,' + (alfa * .55).toFixed(3) + ')';
        cx.shadowColor = 'rgba(244, 227, 191,' + (alfa * .6).toFixed(3) + ')'; cx.shadowBlur = 8;
        cx.beginPath(); cx.moveTo(C.pts[0].x, C.pts[0].y);
        var entero = Math.floor(segs);
        for (var s2 = 1; s2 <= entero; s2++) cx.lineTo(C.pts[s2].x, C.pts[s2].y);
        if (entero < C.pts.length - 1) {
          var A = C.pts[entero], B = C.pts[entero + 1], f = segs - entero;
          cx.lineTo(A.x + (B.x - A.x) * f, A.y + (B.y - A.y) * f);
        }
        cx.stroke();
        cx.shadowBlur = 12;
        var visibles = Math.min(C.pts.length, Math.floor(segs) + 1);
        for (var m = 0; m < visibles; m++) {
          var P = C.pts[m];
          cx.fillStyle = 'rgba(255, 246, 225,' + alfa.toFixed(3) + ')';
          cx.beginPath(); cx.arc(P.x, P.y, P.r, 0, TAU); cx.fill();
        }
        cx.restore();
        if (avance >= 1) {
          var la = Math.min(1, (t - C.dibujo) / 600) * alfa;
          cx.font = FUENTE;
          cx.textAlign = 'center';
          cx.fillStyle = 'rgba(214, 220, 255,' + (la * .7).toFixed(3) + ')';
          cx.fillText(C.nombre, Math.max(60, Math.min(W - 60, C.lx)), Math.min(H - 70, C.ly));
        }
      }

      // estrellas fugaces
      for (var fi = fugaces.length - 1; fi >= 0; fi--) {
        var F = fugaces[fi];
        F.x += F.vx; F.y += F.vy; F.vida -= .018;
        if (F.vida <= 0) { fugaces.splice(fi, 1); continue; }
        var gr = cx.createLinearGradient(F.x, F.y, F.x - F.vx * 9, F.y - F.vy * 9);
        gr.addColorStop(0, 'rgba(255, 246, 225,' + (F.vida * .9).toFixed(3) + ')');
        gr.addColorStop(1, 'rgba(255, 246, 225, 0)');
        cx.strokeStyle = gr; cx.lineWidth = 1.3;
        cx.beginPath(); cx.moveTo(F.x, F.y); cx.lineTo(F.x - F.vx * 9, F.y - F.vy * 9); cx.stroke();
      }
    }

    /* ---------- tiempo ---------- */
    var proxima = 0, proxFugaz = 0, corriendo = true;
    function ciclo(now) {
      if (!corriendo) return;
      if (now > proxima) { nuevaConstelacion(); proxima = now + (reduced ? 9000 : rnd(2800, 4200)); }
      if (!reduced && now > proxFugaz) { nuevaFugaz(); proxFugaz = now + rnd(9000, 16000); }
      pintar(now);
      requestAnimationFrame(ciclo);
    }
    document.addEventListener('visibilitychange', function () {
      corriendo = !document.hidden;
      if (corriendo) requestAnimationFrame(ciclo);
    });

    /* ---------- tocar y mover ---------- */
    function mover(e) { puntero.x = e.clientX; puntero.y = e.clientY; puntero.activo = true; }
    var downX = 0, downY = 0, downT = 0;
    cv.addEventListener('pointerdown', function (e) { mover(e); downX = e.clientX; downY = e.clientY; downT = performance.now(); ocultarAyuda(); });
    cv.addEventListener('pointermove', mover);
    cv.addEventListener('pointerup', function (e) {
      // un toque (sin arrastrar) dibuja una constelación donde tocaste
      if (Math.hypot(e.clientX - downX, e.clientY - downY) < 10 && performance.now() - downT < 400) nuevaConstelacion(e.clientX, e.clientY);
      if (e.pointerType !== 'mouse') setTimeout(function () { puntero.activo = false; }, 600);
    });
    cv.addEventListener('pointerleave', function () { puntero.activo = false; });
    cv.addEventListener('pointercancel', function () { puntero.activo = false; });

    /* ---------- ayuda de la primera visita: una mano invita a tocar ---------- */
    var ayuda = document.getElementById('toca'), ayudaT = 0;
    function ocultarAyuda() { clearTimeout(ayudaT); ayuda.classList.remove('on'); try { localStorage.setItem('profe-anto:cielo', '1'); } catch (e) { /* sin almacenamiento */ } }
    var visto = false;
    try { visto = localStorage.getItem('profe-anto:cielo') === '1'; } catch (e) { /* sin almacenamiento */ }
    if (!visto) { setTimeout(function () { ayuda.classList.add('on'); ayudaT = setTimeout(function () { ayuda.classList.remove('on'); }, 7000); }, 3200); }

    window.addEventListener('resize', ajustar);
    ajustar();
    proxima = performance.now() + 1400;
    proxFugaz = performance.now() + 5000;
    requestAnimationFrame(ciclo);
  })();
  </script>
</body>
</html>
